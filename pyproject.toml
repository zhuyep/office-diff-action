[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "office-diff-action"
version = "0.1.1"
description = "Visual pull-request review for Word and PowerPoint files"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Zhuy" }
]
keywords = ["docx", "pptx", "github-actions", "visual-diff", "office"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "Pillow>=10.0.0",
]

[project.optional-dependencies]
demo = [
  "python-docx>=1.1.0",
  "python-pptx>=1.0.0",
]
dev = [
  "ruff>=0.12.0",
]

[project.scripts]
office-diff = "officediff.cli:main"

[project.urls]
Homepage = "https://github.com/zhuyep/office-diff-action"
Issues = "https://github.com/zhuyep/office-diff-action/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pyright]
pythonVersion = "3.9"
include = ["src"]
